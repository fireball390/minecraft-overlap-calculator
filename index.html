<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Minecraft Chunk Overlap Calculator</title>

<style>

body{
    background:#1e1e1e;
    color:white;
    font-family:Arial,sans-serif;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    color:#55ff55;
}

.card{
    background:#2b2b2b;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

textarea{
    width:100%;
    height:180px;
    background:#111;
    color:white;
    border:1px solid #555;
    border-radius:8px;
    padding:10px;
}

input{
    background:#111;
    color:white;
    border:1px solid #555;
    padding:8px;
    border-radius:5px;
}

button{
    background:#55aa55;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
    margin-right:10px;
}

button:hover{
    background:#66cc66;
}

canvas{
    background:#111;
    border:1px solid #555;
    border-radius:8px;
}

#output{
    background:#111;
    padding:10px;
    border-radius:8px;
    white-space:pre-wrap;
    max-height:300px;
    overflow:auto;
}

#hoverInfo{
    margin-top:10px;
    color:#ffff55;
    font-weight:bold;
}

</style>
</head>

<body>

<h1>Minecraft Chunk Overlap Calculator</h1>

<div class="card">

<h3>Instructions</h3>

Enter coordinates of tell one per line:

<br><br>

1000 2000<br>
1150 2140<br>
1080 2050

</div>

<div class="card">

Render Distance:

<input
id="renderDistance"
type="number"
value="10">

<br><br>

<textarea id="coords"></textarea>

<br><br>

<button onclick="calculate()">
Calculate
</button>

</div>

<div class="card">

<h3>Chunk Map</h3>

<p>
Scroll = Zoom<br>
Click + Drag = Pan
</p>

<canvas
id="chunkMap"
width="900"
height="600">
</canvas>

<div id="hoverInfo">
Hover over a chunk
</div>

</div>

<div class="card">

<h3>Results</h3>

<div id="output">
No calculation yet.
</div>

</div>

<script>

let currentOverlap = null;
let currentCenters = [];

let zoom = 20;

let offsetX = 100;
let offsetY = 100;

let isDragging = false;

let dragStartX = 0;
let dragStartY = 0;

window.onload = function(){

    const canvas =
        document.getElementById(
            "chunkMap"
        );

    canvas.addEventListener(
        "wheel",
        function(e){

            e.preventDefault();

            if(e.deltaY < 0){
                zoom += 2;
            }
            else{
                zoom =
                    Math.max(
                        4,
                        zoom - 2
                    );
            }

            if(currentOverlap){
                drawMap(
                    currentOverlap,
                    currentCenters
                );
            }

        }
    );

    canvas.addEventListener(
        "mousedown",
        function(e){

            isDragging = true;

            dragStartX =
                e.clientX;

            dragStartY =
                e.clientY;

        }
    );

    canvas.addEventListener(
        "mouseup",
        function(){

            isDragging = false;

        }
    );

    canvas.addEventListener(
        "mouseleave",
        function(){

            isDragging = false;

        }
    );

    canvas.addEventListener(
        "mousemove",
        function(e){

            if(isDragging){

                offsetX +=
                    e.clientX -
                    dragStartX;

                offsetY +=
                    e.clientY -
                    dragStartY;

                dragStartX =
                    e.clientX;

                dragStartY =
                    e.clientY;

                drawMap(
                    currentOverlap,
                    currentCenters
                );

            }

        }
    );

};

function drawMap(
    overlap,
    centers
){

    currentOverlap = overlap;
    currentCenters = centers;

    const canvas =
        document.getElementById(
            "chunkMap"
        );

    const ctx =
        canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(!overlap) return;

    let chunks =
        [...overlap]
        .map(
            x =>
            x.split(",")
            .map(Number)
        );

    let xs =
        chunks.map(
            c => c[0]
        );

    let zs =
        chunks.map(
            c => c[1]
        );

    let minX =
        Math.min(...xs);

    let minZ =
        Math.min(...zs);

    chunks.forEach(chunk => {

        let x =
            (chunk[0]-minX)
            * zoom
            + offsetX;

        let z =
            (chunk[1]-minZ)
            * zoom
            + offsetY;

        ctx.fillStyle =
            "#55ff55";

        ctx.fillRect(
            x,
            z,
            zoom-1,
            zoom-1
        );

    });

    centers.forEach(chunk => {

        let x =
            (chunk[0]-minX)
            * zoom
            + offsetX;

        let z =
            (chunk[1]-minZ)
            * zoom
            + offsetY;

        ctx.fillStyle =
            "#ffcc55";

        ctx.fillRect(
            x,
            z,
            zoom-1,
            zoom-1
        );

    });

    canvas.onmousemove =
    function(e){

        let rect =
            canvas
            .getBoundingClientRect();

        let mouseX =
            e.clientX -
            rect.left;

        let mouseY =
            e.clientY -
            rect.top;

        let chunkX =
            Math.floor(
                (
                    mouseX -
                    offsetX
                )
                / zoom
            ) + minX;

        let chunkZ =
            Math.floor(
                (
                    mouseY -
                    offsetY
                )
                / zoom
            ) + minZ;

        document
        .getElementById(
            "hoverInfo"
        )
        .innerText =

        "Chunk: "
        + chunkX
        + ", "
        + chunkZ
        + " | Center Block: "
        + (chunkX*16+8)
        + ", "
        + (chunkZ*16+8);

    };

}

function calculate(){

    const rd =
        parseInt(
            document
            .getElementById(
                "renderDistance"
            ).value
        );

    const lines =
        document
        .getElementById(
            "coords"
        )
        .value
        .trim()
        .split("\n");

    let overlap = null;

    let centers = [];

    for(let line of lines){

        let parts =
            line.trim()
            .split(/\s+/);

        if(parts.length < 2)
            continue;

        let x =
            parseInt(
                parts[0]
            );

        let z =
            parseInt(
                parts[1]
            );

        let chunkX =
            Math.floor(x/16);

        let chunkZ =
            Math.floor(z/16);

        centers.push([
            chunkX,
            chunkZ
        ]);

        let area =
            new Set();

        for(
            let dx=-rd;
            dx<=rd;
            dx++
        ){

            for(
                let dz=-rd;
                dz<=rd;
                dz++
            ){

                area.add(
                    (chunkX+dx)
                    + ","
                    + (chunkZ+dz)
                );

            }

        }

        if(overlap === null){

            overlap = area;

        }
        else{

            overlap =
                new Set(
                    [...overlap]
                    .filter(
                        c =>
                        area.has(c)
                    )
                );

        }

    }

    if(
        !overlap
        ||
        overlap.size===0
    ){

        document
        .getElementById(
            "output"
        )
        .textContent =
        "No overlap found.";

        return;

    }

    let result =
        "Possible Chunks: "
        + overlap.size
        + "\n\n";

    overlap.forEach(chunk => {

        let [cx,cz] =
            chunk
            .split(",")
            .map(Number);

        result +=
        "Chunk "
        + cx
        + ", "
        + cz
        + " | Center "
        + (cx*16+8)
        + ", "
        + (cz*16+8)
        + "\n";

    });

    drawMap(
        overlap,
        centers
    );

    document
    .getElementById(
        "output"
    )
    .textContent =
    result;

}

</script>

</body>
</html>
